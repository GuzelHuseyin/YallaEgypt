<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Yalla Egypt">
  <title>Yalla Egypt</title>
  <!-- Compact brand mark: the medallion reduced to ring, clock ticks,
       sun and three pyramids. The camels and inner ring of the full
       logo (design/yalla-egypt-logo-3.pdf) vanish below about 48px,
       so they are dropped here. Geometry matches assets/icons/*.png
       and the #ye-mark-compact symbol in index.html. -->
  <rect width="64" height="64" fill="#0B0A08"/>
  <g fill="#C9A24B">
    <path d="M20.2 34 13.8 44.9h12.1zM32 26.7 24 44.9h16.1zM43.8 34 38.1 44.9h12.1z"/>
    <circle cx="32" cy="20" r="2.8"/>
  </g>
  <g fill="none" stroke="#C9A24B" stroke-linecap="round">
    <circle cx="32" cy="32" r="26.4" stroke-width="3"/>
    <path d="M39.01 12.74 41.03 7.19M24.99 12.74 22.97 7.19" stroke-width="2.2"/>
    <path d="M14 44.9h36" stroke-width="1"/>
  </g>
</svg>
